<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Imperial Calendar · Sector Solo Six</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/calendar.css">
</head>
<body>
  <header class="top">
    <div class="clock" id="clock">
      <p class="status">Reading ship's log…</p>
    </div>
    <nav class="tabs" id="views" aria-label="Views"></nav>
  </header>
  <div class="deck" id="deck">
    <main id="main"></main>
    <aside class="log" id="log" aria-live="polite"></aside>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
